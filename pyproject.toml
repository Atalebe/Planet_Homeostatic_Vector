[project]
name = "phv"
version = "0.1.0"
description = "Planet Homeostatic Vector: (R,H,M,S) + bounded Phi_p window + ripeness coupling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.scripts]
phv = "phv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
