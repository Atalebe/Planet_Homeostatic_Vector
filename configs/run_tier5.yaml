# configs/run_tier5.yaml
run:
  run_id: PHV-TIER5-v1
  out_dir: data/derived/tier5

inputs:
  tier4_enriched_csv: data/derived/tier4/tier4_enriched.csv

tier5:
  run_id: PHV-TIER5-v1
  tier4_enriched_csv: data/derived/tier4/tier4_enriched.csv
  ps_csv: data/raw/exoplanets/PS_2026.02.23_02.08.36.csv

  require_previous_pass: true
  require_rocky: true
  rocky_rmax_rearth: 1.8

  n_mc: 20000
  seed: 12345
  age_scale_gyr: 4.5

  use_ps_errors: true
  use_floors_when_missing: true

  # conservative floors only used when PS err columns are missing
  floor_frac_rade: 0.03
  floor_frac_bmasse: 0.10
  floor_frac_teq: 0.02
  floor_frac_insol: 0.10
  floor_abs_ecc: 0.02
  floor_abs_age_gyr: 0.5

  # how to resolve multiple PS rows per planet:
  # "closest_to_tier4" is the safest because it anchors to your pipeline's chosen nominal values
  ps_select_method: closest_to_tier4

# Use the same Tier2 gates you already used (defaults shown)
gates:
  S_min: 0.2
  S_max: 2.0
  Teq_min_K: 180.0
  Teq_max_K: 300.0
  e_max: 0.2
  require_age: true
  require_rocky: true
  rocky_rmax_rearth: 1.8

# Tier3 “sanity physics” (defaults shown)
tier3:
  rho_min_g_cm3: 3.0
  rho_max_g_cm3: 10.0
  vesc_min_rel_earth: 1.0

# Tier4 follow-up weighting (match your Tier4 behavior: factor=1+0.5*score)
tier4:
  depth_ref: 0.005
  mag_ref_min: 7.0
  mag_ref_max: 13.0
  alpha_factor: 0.5

outputs:
  save_samples: false
